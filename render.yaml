services:
  - type: web
    name: wa-melayu-arab-bot
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DEFAULT_VOICE
        value: ar-SA-HamedNeural
      - key: DEFAULT_RATE
        value: "+0%"
      - key: DEFAULT_STT_LANG
        value: ar-SA
      - key: ALLOW_SELF_CHAT
        value: "true"
      - key: AUTO_REPLY
        value: "false"
      - key: GROUP_AUTO_REPLY
        value: "false"
      - key: MAX_AUDIO_SECONDS
        value: "300"
      - key: MAX_SESSIONS
        value: "10"
      - key: SESSION_DURATION_MINUTES
        value: "60"
      - key: PENDING_QR_TIMEOUT_SECONDS
        value: "120"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
